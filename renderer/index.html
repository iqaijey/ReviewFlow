<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http:">
  <title>ReviewFlow</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles/findings.css">
  <link rel="stylesheet" href="styles/history.css">
  <link rel="stylesheet" href="styles/chat.css">
  <link rel="stylesheet" href="styles/workspace.css">
  <link rel="stylesheet" href="styles/run-status.css">
  <link rel="stylesheet" href="styles/sources.css">
  <link rel="stylesheet" href="styles/fixloop.css">
  <link rel="stylesheet" href="styles/overview-perf.css">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-brand">
      <svg class="sidebar-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="21" height="21" rx="6"
          fill="var(--accent-bg)" stroke="var(--accent)"/>
        <path d="M7 12.5l3.2 3.2L17 9" stroke="var(--accent)"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="app-title">ReviewFlow</span>
      <button id="btn-sidebar-toggle" class="btn btn-icon sidebar-toggle-btn" type="button"
        title="收起侧边栏" aria-label="收起侧边栏" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
    </div>
    <nav id="tab-bar" aria-label="主导航"></nav>
    <div class="sidebar-footer">
      <div id="run-indicator" class="run-indicator" style="display:none" title="查看运行详情"></div>
      <div class="sidebar-project-row">
        <div id="project-chip" class="project-chip" role="button" tabindex="0"
          aria-haspopup="listbox" aria-expanded="false" aria-label="选择最近项目" title="点击选择最近项目">
          <span id="project-name" class="project-name">未选择项目</span>
          <div id="project-path" class="project-path">未选择项目</div>
        </div>
        <button id="btn-theme" class="btn btn-icon" type="button" title="切换主题" aria-label="切换主题"></button>
      </div>
      <div class="sidebar-actions">
        <button id="btn-select-folder" class="btn btn-primary" title="选择项目" aria-label="选择项目">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
          <span>选择项目</span>
        </button>
        <button id="btn-rescan" class="btn" title="重新扫描" aria-label="重新扫描">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span>重新扫描</span>
        </button>
      </div>
    </div>
  </aside>
  <main id="tab-content"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
