name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 语法检查
        run: npm run check
      - name: 类型检查
        run: npm run typecheck
      - name: 单测
        run: npm test
